<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Safe LocalStorage Auto-fill
        try {
            const fName = localStorage.getItem('firstName');
            const lName = localStorage.getItem('lastName');
            const email = localStorage.getItem('email');
            const phone = localStorage.getItem('phone');

            if (fName) document.getElementById('firstName').value = fName;
            if (lName) document.getElementById('lastName').value = lName;
            if (email) document.getElementById('email').value = email;
            if (phone) document.getElementById('phone').value = phone;
        } catch (e) {
            console.warn('LocalStorage access restricted:', e);
        }
    };

    function goNext(event) {
        event.preventDefault();

        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !email || !phone) {
            alert("Veuillez remplir tous les champs.");
            return;
        }

        // Phone number validation (07, 05, or 01 followed by 8 digits)
        if (!/^(07|05|01)\d{8}$/.test(phone)) {
            alert("Veuillez entrer un numéro Orange Money Côte d'Ivoire valide à 10 chiffres (ex: 0707123456).");
            return;
        }

        // Save to LocalStorage safely
        try {
            localStorage.setItem('firstName', fName);
            localStorage.setItem('lastName', lName);
            localStorage.setItem('email', email);
            localStorage.setItem('phone', phone);
            localStorage.setItem('userPhone', phone);
        } catch (e) {
            console.warn('LocalStorage write restricted:', e);
        }

        // Direct navigation to next file
        window.location.href = "page4.html";
    }

    function goBack() {
        window.location.href = "page2.html";
    }
</script>
