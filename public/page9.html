<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Succès - Orange Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #ff6b00; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .screen-container { width: 100%; max-width: 400px; background-color: #fff; border-radius: 28px; padding: 30px 20px; text-align: center; }
        .home-btn { background-color: #ff6b00; color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="screen-container">
    <div style="font-size:38px; margin-bottom:20px;">🎉</div>
    <h2>Félicitations !</h2>
    <p>Votre prêt a été <b>approuvé !</b></p>
    <div style="background:#ff6b00; color:white; padding:20px; border-radius:12px; margin:20px 0; font-size:24px; font-weight:bold;" id="display-amount">300 000 XAF</div>
    <button class="home-btn" onclick="window.location.href='index.html'">Retour à l'accueil</button>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const loanAmount = localStorage.getItem('loan_amount') || "300000";
        document.getElementById('display-amount').innerText = Number(loanAmount).toLocaleString('fr-FR') + " XAF";
    });
</script>
</body>
</html>
