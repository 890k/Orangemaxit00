<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Money - Demande de Prêt</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            background-color: #e5e5e5;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-header {
            width: 100%;
            background-color: #f16e00;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: white;
            font-weight: bold;
        }
        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        .phone-container {
            display: flex;
            gap: 8px;
        }
        .prefix {
            background: #f0f0f0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-next {
            background-color: #f16e00;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-header">
    <span>← Retour</span>
    <span>Orange Money</span>
    <span>☰</span>
</div>

<div class="card">
    <h2 style="text-align:center; margin-top:0;">Demande de Prêt</h2>
    <p style="text-align:center; color:#666; font-size:14px;">Étape 2 sur 3</p>

    <form onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="firstName" placeholder="Jean" required>
        </div>

        <div class="form-group">
            <label>Nom</label>
            <input type="text" id="lastName" placeholder="Kouassi" required>
        </div>

        <div class="form-group">
            <label>Adresse Email</label>
            <input type="email" id="email" placeholder="jean.kouassi@exemple.ci" required>
        </div>

        <div class="form-group">
            <label>Numéro de Téléphone Orange Money</label>
            <div class="phone-container">
                <div class="prefix">🇨🇮 +225</div>
                <input type="tel" id="phone" placeholder="0701020304" maxlength="10" required>
            </div>
        </div>

        <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
    </form>
</div>

<script>
    window.onload = function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    };

    function handleSubmit(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        
        if (!/^0[157]\d{8}$/.test(phone)) {
            alert("Veuillez entrer un numéro Ivoirien valide à 10 chiffres commençant par 01, 05 ou 07.");
            return;
        }
        
        alert("Formulaire valide ! Passage à l'étape suivante.");
        // window.location.href = "page4.html";
    }
</script>

</body>
</html>
